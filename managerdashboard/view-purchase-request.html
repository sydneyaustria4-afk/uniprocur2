<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#bd1715">
  <title>UniProcur | View Purchase Request</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="view-purchase-request.css?v=2">
  <link rel="stylesheet" href="view-purchase-request-decision.css?v=1">
  <script src="view-purchase-request.js?v=2" defer></script>
  <script src="../assets/uniprocur-display-roles.js?v=20261113-roles" defer></script>
</head>
<body>
  <div class="view-shell">
    <header class="request-topbar">
      <div class="request-brand">
        <span class="brand-mark">
          <img src="../assets/Pro 4.svg" alt="UniProcur">
        </span>
        <span class="brand-copy">
          <span>View Purchase Request</span>
          <strong id="headerPRNumber">Loading...</strong>
        </span>
      </div>

      <div class="topbar-account">
        <span class="notification-button">
          <img src="../assets/Group 50.svg" alt="">
        </span>
        <span class="account-divider"></span>
        <span class="account-copy">
          <strong id="buyerName">Buyer</strong>
          <span id="buyerEmail">buyer@gmail.com</span>
        </span>
        <span class="account-avatar">C</span>
      </div>
    </header>

    <main class="view-container">
      <a class="back-button" href="buyer-dashboard.html" aria-label="Back to dashboard">
        <span>‹</span>
      </a>

      <div id="loadingMessage" class="page-message">Loading Purchase Request...</div>
      <div id="errorMessage" class="page-message error-message" hidden>
        Purchase Request could not be loaded.
      </div>

      <section class="pr-view-card" id="prViewCard" hidden>
        <div class="pr-overview">
          <div class="pr-meta">
            <div class="meta-item">
              <span>PR No.</span>
              <strong id="prNumber">—</strong>
            </div>
            <div class="meta-item">
              <span>Date Created</span>
              <strong id="createdDate">—</strong>
            </div>
            <div class="meta-item">
              <span id="decisionDateLabel">Approval Date</span>
              <strong id="approvedDate">Not yet decided</strong>
            </div>
          </div>

          <div class="pr-actions" id="prActions">
            <button class="delete-button" id="deleteDraftButton" type="button">
              <span>▤</span> Delete Draft
            </button>
            <button class="outline-button" id="editPRButton" type="button">
              <span>✎</span> Edit PR
            </button>
            <button class="outline-button" id="submitPRButton" type="button">
              <span>✎</span> Submit PR
            </button>
          </div>
        </div>

        <div class="pr-content">
          <section class="items-panel">
            <div id="itemList" class="item-list"></div>
            <div class="purpose-panel">
              <strong>Justification / Purpose</strong>
              <p id="prPurpose">—</p>
            </div>
          </section>

          <aside class="approval-panel">
            <h2>Approval History</h2>
            <div class="timeline" id="approvalTimeline"></div>
          </aside>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
