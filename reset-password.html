<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your UniProcur password">
  <title>UniProcur | Reset Password</title>
  <link rel="stylesheet" href="reset-password.css">
  <style>
    .reset-shell { width: min(100% - 32px, 751px); }
    .reset-column { width: 390px; flex-basis: 390px; }
    .reset-card {
      min-height: 500px;
      padding-right: 36px;
      padding-left: 36px;
      background: url("assets/Subtract.png") center / 100% 100% no-repeat !important;
    }
    .password-field img {
      display: block;
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .password-field .password-toggle {
      display: grid;
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      padding: 0;
      place-items: center;
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
    }
    .password-field .password-toggle svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }
    .password-field .password-toggle svg[hidden] { display: none; }
    .service-card { width: 365px !important; height: 500px !important; }
    @media (max-width: 760px) {
      .reset-shell { width: min(100% - 28px, 430px); }
      .reset-column { width: 100%; flex-basis: auto; }
      .reset-card { min-height: 500px; padding-right: 28px; padding-left: 28px; }
      .service-card { width: 100% !important; height: 360px !important; }
    }
    @media (max-width: 390px) {
      .reset-card { padding-right: 18px; padding-left: 18px; }
    }
  </style>
</head>
<body>
  <main class="reset-shell">
    <section class="reset-column" aria-labelledby="reset-title">
      <button class="back-button" id="backButton" type="button" aria-label="Back to sign in">&lsaquo;</button>
      <div class="reset-card">
        <form id="resetForm" novalidate>
          <h1 id="reset-title">Reset Password</h1>
          <p class="reset-copy">Enter the code sent to your e-mail<br>to reset your password</p>
          <div class="code-inputs" role="group" aria-label="Six digit reset code">
            <input maxlength="1" inputmode="numeric" aria-label="Digit 1" required>
            <input maxlength="1" inputmode="numeric" aria-label="Digit 2" required>
            <input maxlength="1" inputmode="numeric" aria-label="Digit 3" required>
            <input maxlength="1" inputmode="numeric" aria-label="Digit 4" required>
            <input maxlength="1" inputmode="numeric" aria-label="Digit 5" required>
            <input maxlength="1" inputmode="numeric" aria-label="Digit 6" required>
          </div>
          <p class="resend-copy">Didn&apos;t receive code? <button id="resendButton" type="button">Resend</button></p>
          <hr>
          <h2>New Password</h2>
          <label class="password-field" for="newPassword"><span aria-hidden="true"><img src="assets/password-key.svg" alt=""></span><input id="newPassword" type="password" placeholder="password" autocomplete="new-password" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false"><svg class="password-eye" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="password-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button></label>
          <ul class="requirements" aria-label="Password requirements"><li id="lowercase">At least one lowercase letter</li><li id="length">Minimum of 8 characters</li><li id="uppercase">At least one uppercase letter</li><li id="number">At least one number</li></ul>
          <div class="action-row"><button class="cancel-button" id="cancelButton" type="button">Cancel</button><button class="reset-button" type="submit">Reset Password</button></div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
    <section class="service-card" aria-label="UniProcur procurement service"><img class="service-photo" src="assets/procurement-photo.jpg" alt="Red shipping container at a port"><div class="service-overlay"></div><p class="service-title">Procurement Service</p><div class="brand-mark"><img src="assets/logo.png" alt=""><span>UniProcur</span></div></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="reset-password.js"></script>
</body>
</html>
