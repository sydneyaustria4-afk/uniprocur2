<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recover your UniProcur account password">
  <title>UniProcur | Forgot Password</title>
  <link rel="stylesheet" href="forgot-password.css">
  <style>
    .back-button { top: 7px; }
  </style>
</head>
<body>
  <main class="recovery-shell">
    <section class="recovery-column" aria-labelledby="recovery-title">
      <button class="back-button" id="backButton" type="button" aria-label="Back to login">&lsaquo;</button>
      <div class="recovery-card">
        <form id="recoveryForm" novalidate>
          <h1 id="recovery-title">Forgot Password?</h1>
          <p class="recovery-copy">Please enter your e-mail below then we will have you recover your account.</p>
          <label class="email-field" for="recoveryEmail">
            <span class="email-icon" aria-hidden="true">@</span>
            <input id="recoveryEmail" name="email" type="email" placeholder="e-mail address" autocomplete="email" required>
          </label>
          <div class="recovery-actions">
            <button class="alternate-button" id="alternateButton" type="button">Try another way</button>
            <button class="send-button" type="submit">Send Code</button>
          </div>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
        <p class="register-copy">Doesn&apos;t have an account? <button id="registerButton" type="button">Register</button></p>
      </div>
      <article class="reminders-card">
        <h2>Reminders</h2>
        <ul id="reminderList" hidden>
          <li>Check your spam or junk folder.</li>
          <li>Use the e-mail registered with your account.</li>
        </ul>
      </article>
    </section>

    <section class="service-card" aria-label="UniProcur procurement service">
      <img class="service-photo" src="assets/procurement-photo.jpg" alt="Red shipping container at a port">
      <div class="service-overlay"></div>
      <p class="service-title">Procurement Service</p>
      <div class="brand-mark">
        <img src="assets/logo.png" alt="">
        <span>UniProcur</span>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="forgot-password.js"></script>
</body>
</html>
